services:
  backend-app:
    restart: unless-stopped
    container_name: avtodiva-backend
    image: andreypolezhaiev/avtodiva-backend:latest
    env_file:
      - .env
    ports:
      - "${SPRING_LOCAL_PORT}:${SPRING_DOCKER_PORT}"
    networks:
      - avtodiva-net
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url" : "jdbc:postgresql://${DB_HOST}:${DB_DOCKER_PORT}/${DB_NAME}${DB_PARAMS}",
        "spring.datasource.username" : "${DB_USERNAME}",
        "spring.datasource.password" : "${DB_PASSWORD}",
        "spring.liquibase.change-log" : "classpath:db/changelog/db.changelog-master.yaml",
        "spring.jpa.hibernate.ddl-auto" : "validate",
        "spring.jpa.open-in-view" : "false",
        "jwt.secret" : "${JWT_SECRET}",
        "jwt.expiration" : "${JWT_EXPIRATION}",
        "spring.jpa.show-sql" : "false",
        "spring.jpa.properties.hibernate.show_sql" : "false",
        "spring.jpa.properties.hibernate.format_sql" : "false",
        "logging.level.org.hibernate.SQL" : "OFF",
        "logging.level.org.hibernate.stat" : "OFF",
        "spring.jpa.properties.hibernate.jdbc.batch_size" : "${BATCH_SIZE}",
        "spring.jpa.properties.hibernate.order_inserts" : "true",
        "spring.jpa.properties.hibernate.order_updates" : "true",
        "spring.jpa.properties.hibernate.generate_statistics" : "false",
        "CORS_ALLOWED_ORIGINS" : "${CORS_ALLOWED_ORIGINS}"
      }'

networks:
  avtodiva-net:
    external: true
    name: avtodiva-network