services:
  backend-app:
    restart: unless-stopped
    container_name: avtodiva-backend
    image: ghcr.io/andreypolezhaiev/avtodiva-backend:latest
    build: .
    env_file:
      - .env
    ports:
      - "${SPRING_LOCAL_PORT}:${SPRING_DOCKER_PORT}"
    networks:
      - avtodiva-net
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - kafka

  kafka:
    image: apache/kafka:latest
    container_name: avtodiva-kafka
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: INSIDE://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - avtodiva-net

volumes:
  kafka_data:

networks:
  avtodiva-net:
    external: true
    name: avtodiva-network